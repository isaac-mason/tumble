# the examples on github pages: the js examples at the root, the C++ samples app built with emscripten at /samples/
name: pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            # the package the js examples import, built over the committed dist/tumble.wasm
            - name: js package
              working-directory: js
              run: |
                  npm install --no-audit --no-fund
                  npm run build

            - name: js examples
              working-directory: js/examples
              run: |
                  npm ci --no-audit --no-fund
                  npm run build

            - uses: mymindstorm/setup-emsdk@v14
              with:
                  version: 6.0.9

            - name: samples
              run: |
                  sudo apt-get install -y ninja-build
                  cmake --preset samples-web
                  cmake --build --preset samples-web

            - name: site
              run: |
                  mkdir -p site/samples
                  cp -r js/examples/dist/. site/
                  cp build/samples/web/samples/tumble_samples.js build/samples/web/samples/tumble_samples.wasm build/samples/web/samples/tumble_samples.data site/samples/
                  cp build/samples/web/samples/tumble_samples.html site/samples/index.html

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
