<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tumble samples</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #202020; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<script>
// ?example=example_<name> opens that example. ?a=<arg>&a=<arg>: the app's command line, as the headless screenshots pass it
var params = new URLSearchParams(location.search);
var example = params.get('example');
var Module = { canvas: document.getElementById('canvas'), arguments: (example ? [example] : []).concat(params.getAll('a')) };
</script>
{{{ SCRIPT }}}
</body>
</html>
